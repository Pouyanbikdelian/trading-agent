# Risk manager configuration — REFERENCE ONLY. NOTHING LOADS THIS FILE.
#
# Verified 2026-08-07 by grepping every reference in src/: the only
# mention of "risk.yaml" anywhere in the codebase is a docstring in
# runner/playbook.py. No loader exists.
#
# The 2026-07-09 header was already half-right — it said the risk manager
# reads .env only, which is true — but it went on to claim "this file
# still feeds the backtester/simulator sections (slippage_model)". It
# does not. The backtester takes an explicit CostModel from its caller,
# and the live cycle passes ZERO_COSTS.
#
# That mattered because CLAUDE.md lists "change risk limit defaults in
# .env.example or config/risk.yaml" as needing the owner's approval,
# which reads as though editing this file changes behaviour. Editing it
# changes nothing at all.
#
# WHERE THE REAL VALUES LIVE:
#   max_gross_exposure, max_position_pct, max_daily_loss_pct,
#   max_drawdown_pct, max_margin_borrowing_pct  -> .env
#   max_sector_exposure, allow_short            -> RiskLimits defaults
#                                                  (risk/limits.py)
#   backtest costs                              -> the CostModel passed
#                                                  to run_vectorized()
#
# The values below are kept as a record of intent. Three of them describe
# controls that DO NOT EXIST anywhere — flagged inline.

portfolio:
  # Max total long+short exposure as a fraction of equity. 1.0 = fully invested, no leverage.
  max_gross_exposure: 1.0
  # Max net long-short exposure. 1.0 = fully long, -1.0 = fully short, 0 = market-neutral.
  max_net_exposure: 1.0
  # Annualized portfolio vol target. Used by the vol-targeting overlay.
  vol_target: 0.12          # 12% annualized

position:
  # Cap any single instrument as a fraction of equity (long or short).
  max_position_pct: 0.10
  # Sector concentration cap. IMPLEMENTED, but from RiskLimits
  # .max_sector_exposure (default 0.30) — not from this line. They agree
  # today by coincidence, not by wiring.
  max_sector_pct: 0.30
  # NOT IMPLEMENTED. No dust filter exists on any order path; a delta of
  # one share is submitted like any other. Harmless at current sizing
  # (~2.5k per name) — it would bite on a much larger universe or a much
  # smaller sleeve, where commission can exceed the trade's value.
  min_trade_notional: 50.0

drawdown:
  # Daily PnL loss threshold (fraction of equity at session start). Triggers a
  # one-day kill switch: positions can be reduced but not increased.
  max_daily_loss_pct: 0.02
  # Peak-to-trough drawdown that halts the system entirely until a human resets.
  max_drawdown_pct: 0.15

execution:
  # NOT IMPLEMENTED. Nothing checks intended notional against average
  # daily volume, on any path. Not binding at current size (a ~2.5k order
  # in an S&P name is noise), but it is a control this file describes and
  # the system does not have.
  max_pct_adv: 0.05

slippage_model:
  # NOT WIRED. The header used to claim the simulator reads these. It
  # does not — run_vectorized() takes an explicit CostModel from its
  # caller, and the live cycle passes ZERO_COSTS ("sentinel for tests and
  # pure-signal analyses", per its own docstring).
  #
  # Consequence, currently LATENT: when the combiner is risk-aware
  # (inverse_vol / min_variance / dsr_weighted) AND more than one
  # strategy is configured, per-strategy returns are ranked with zero
  # costs — which systematically favours high-turnover strategies,
  # because turnover is free in that computation. The live config runs a
  # single strategy with combiner=equal_weight, both of which short-
  # circuit before the returns are computed, so nothing is biased today.
  # Revisit before running a multi-strategy risk-aware combiner.
  equity_bps: 5        # 5 bps per side
  fx_bps: 1
  crypto_bps: 10
